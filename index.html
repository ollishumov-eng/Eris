<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eris hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        .background {
            position: fixed; inset: 0;
            background-image: url('Eris.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(16px) brightness(0.45);
            transform: scale(1.18);
            z-index: 1;
        }
        .gradient-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(
                135deg,
                rgba(0,0,0,0.95) 0%,
                rgba(0,0,0,0.6) 25%,
                rgba(40,40,40,0.45) 50%,
                rgba(255,255,255,0.3) 75%,
                rgba(255,255,255,0.8) 100%
            );
            z-index: 2;
        }

        .screen {
            position: fixed; inset: 0; z-index: 3;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none;
            transform: translateY(20px) scale(0.98);
            filter: blur(8px);
            transition: opacity 0.55s ease,
                        transform 0.6s cubic-bezier(.2,.8,.2,1),
                        filter 0.55s ease;
        }
        .screen.active {
            opacity: 1; pointer-events: auto;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        .home-content {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 2.2rem; padding: 1.5rem; width: 100%;
        }
        .title {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: clamp(1.8rem, 7vw, 5.5rem);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #fff;
            text-shadow:
                0 0 10px rgba(255,255,255,0.6),
                0 0 30px rgba(255,255,255,0.35),
                0 0 60px rgba(255,255,255,0.15),
                3px 3px 0 rgba(0,0,0,0.9);
            white-space: nowrap; user-select: none;
            animation: fadeIn 1.6s ease-out forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); filter: blur(6px); }
            to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .action-area {
            position: relative;
            width: 100%; max-width: 380px; min-height: 60px;
            display: flex; flex-direction: column; align-items: center;
            animation: fadeIn 1.8s ease-out forwards;
            opacity: 0;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 700; font-size: 1rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: #000;
            background: linear-gradient(135deg, #fff 0%, #d9d9d9 100%);
            border: none; border-radius: 10px;
            padding: 0.95rem 2rem; width: 100%;
            cursor: pointer;
            box-shadow:
                0 0 20px rgba(255,255,255,0.35),
                0 8px 24px rgba(0,0,0,0.5);
            transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                        box-shadow 0.35s ease,
                        background 0.35s ease,
                        opacity 0.4s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 30px rgba(255,255,255,0.55),
                0 12px 30px rgba(0,0,0,0.6);
        }
        .btn:active { transform: translateY(0); }
        .fade-out {
            opacity: 0 !important;
            transform: translateY(-14px) scale(0.97) !important;
            pointer-events: none !important;
        }

        .auth-form {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; gap: 0.8rem;
            background: rgba(15,15,15,0.65);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px; padding: 1.4rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            opacity: 0; transform: translateY(18px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.4s ease,
                        transform 0.45s cubic-bezier(.2,.8,.2,1);
        }
        .auth-form.active {
            opacity: 1; transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .auth-form input {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem; padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff; outline: none;
            transition: border 0.25s ease, background 0.25s ease;
        }
        .auth-form input::placeholder { color: rgba(255,255,255,0.55); }
        .auth-form input:focus {
            border-color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.14);
        }
        .form-actions { display: flex; gap: 0.6rem; margin-top: 0.3rem; }
        .form-actions .btn { flex: 1; }
        .btn-secondary {
            background: transparent; color: #fff;
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            box-shadow: none;
        }
        .error-msg {
            font-size: 0.8rem; color: #ff6b6b;
            min-height: 1rem; text-align: center;
            transition: opacity 0.25s ease;
        }

        .switch-auth {
            margin-top: 0.4rem;
            text-align: center;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.03em;
        }
        .switch-auth .link {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.5);
            cursor: pointer;
            transition: color 0.3s ease,
                        border-color 0.3s ease,
                        text-shadow 0.3s ease;
        }
        .switch-auth .link:hover {
            color: #8affc1;
            border-color: #8affc1;
            text-shadow: 0 0 12px rgba(138,255,193,0.5);
        }

        .account-btn {
            position: absolute; top: 0; left: 0;
            background: linear-gradient(135deg, #2b2b2b 0%, #0d0d0d 100%);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow:
                0 0 20px rgba(255,255,255,0.2),
                0 8px 24px rgba(0,0,0,0.6);
            opacity: 0; transform: translateY(18px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.4s ease,
                        transform 0.45s cubic-bezier(.2,.8,.2,1),
                        background 0.35s ease,
                        box-shadow 0.35s ease;
        }
        .account-btn:hover {
            background: linear-gradient(135deg, #3a3a3a 0%, #151515 100%);
            box-shadow:
                0 0 30px rgba(255,255,255,0.35),
                0 12px 30px rgba(0,0,0,0.7);
        }
        .account-btn.visible {
            opacity: 1; transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        #accountScreen { padding: 0; display: flex; }
        .layout {
            display: flex; width: 100%; height: 100vh;
        }
        .sidebar {
            width: 260px; min-width: 220px; height: 100vh;
            padding: 2rem 1.2rem;
            display: flex; flex-direction: column; gap: 0.5rem;
            background: rgba(10,10,10,0.55);
            border-right: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(14px);
        }
        .sidebar .brand {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 1.2rem; text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.6rem; padding-left: 0.6rem;
            text-shadow: 0 0 14px rgba(255,255,255,0.5);
        }
        .nav-item {
            display: block;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            color: rgba(255,255,255,0.75);
            font-weight: 600; font-size: 0.9rem;
            letter-spacing: 0.04em; text-transform: uppercase;
            text-decoration: none; cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.3s ease,
                        color 0.3s ease,
                        transform 0.3s ease,
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }
        .nav-item:hover {
            background: rgba(255,255,255,0.07);
            color: #fff; transform: translateX(4px);
        }
        .nav-item.active {
            background: linear-gradient(135deg, #fff 0%, #cfcfcf 100%);
            color: #000;
            border-color: rgba(255,255,255,0.5);
            box-shadow:
                0 0 18px rgba(255,255,255,0.35),
                0 6px 18px rgba(0,0,0,0.4);
        }
        .nav-item.owner {
            color: #ffd76b;
            border-color: rgba(255,215,107,0.35);
        }
        .nav-item.owner:hover {
            background: rgba(255,215,107,0.1);
            color: #ffe6a0;
        }
        .nav-item.owner.active {
            background: linear-gradient(135deg, #ffd76b 0%, #b98f2a 100%);
            color: #000;
            border-color: rgba(255,215,107,0.6);
            box-shadow:
                0 0 22px rgba(255,215,107,0.45),
                0 6px 18px rgba(0,0,0,0.4);
        }
        .sidebar .spacer { flex: 1; }
        .logout {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            padding: 0.7rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .logout:hover {
            background: rgba(255,80,80,0.15);
            color: #ff8a8a;
        }

        .main {
            flex: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 2rem; text-align: center;
            overflow-y: auto;
        }
        .main.main-account {
            justify-content: flex-start;
            padding-top: 12vh;
        }
        .welcome-row {
            display: flex; align-items: baseline;
            gap: 0.7rem; flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.8rem;
        }
        .welcome-label {
            font-size: clamp(0.8rem, 1.6vw, 1rem);
            letter-spacing: 0.4em; text-transform: uppercase;
            color: rgba(255,255,255,0.55);
        }
        .welcome-name {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: clamp(1.6rem, 4.5vw, 3.6rem);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            text-shadow:
                0 0 12px rgba(255,255,255,0.5),
                0 0 40px rgba(255,255,255,0.25),
                3px 3px 0 rgba(0,0,0,0.85);
        }

        .params {
            display: flex; flex-direction: column;
            gap: 0.7rem; width: 100%; max-width: 460px;
        }
        .param-row {
            display: flex; justify-content: space-between;
            align-items: center; gap: 1rem;
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            background: rgba(15,15,15,0.55);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            transition: border-color 0.3s ease,
                        background 0.3s ease,
                        transform 0.3s ease;
        }
        .param-row:hover {
            border-color: rgba(255,255,255,0.3);
            background: rgba(25,25,25,0.65);
            transform: translateY(-2px);
        }
        .param-key {
            font-size: 0.8rem; letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            font-weight: 600;
            flex-shrink: 0;
        }
        .param-right {
            display: flex; align-items: center;
            gap: 0.7rem;
        }
        .param-value {
            font-weight: 700; font-size: 0.95rem;
            color: #fff; letter-spacing: 0.06em;
            word-break: break-all;
            text-align: right;
        }
        .param-value.free { color: #8affc1; }
        .param-value.premium { color: #ffd76b; }
        .param-value.none { color: rgba(255,255,255,0.4); }

        .btn-reset {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            color: #fff;
            transition: background 0.3s ease,
                        border-color 0.3s ease,
                        transform 0.2s ease,
                        box-shadow 0.3s ease;
        }
        .btn-reset:hover:not(:disabled) {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.7);
            box-shadow: 0 0 14px rgba(255,255,255,0.35);
            transform: translateY(-1px);
        }
        .btn-reset:active:not(:disabled) { transform: translateY(0); }
        .btn-reset:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03);
        }

        .section-title {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: clamp(1.6rem, 4vw, 3rem);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
            text-shadow:
                0 0 12px rgba(255,255,255,0.5),
                0 0 40px rgba(255,255,255,0.25),
                3px 3px 0 rgba(0,0,0,0.85);
        }

        .scripts {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 520px;
        }
        .script-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 1.4rem 1.5rem;
            border-radius: 14px;
            background: rgba(15,15,15,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                        border-color 0.35s ease,
                        box-shadow 0.35s ease;
        }
        .script-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 16px 36px rgba(0,0,0,0.6);
        }
        .script-card.premium-card {
            border-color: rgba(255,215,107,0.45);
            box-shadow:
                0 0 22px rgba(255,215,107,0.15),
                0 10px 30px rgba(0,0,0,0.5);
        }
        .script-card.premium-card:hover {
            border-color: rgba(255,215,107,0.75);
            box-shadow:
                0 0 32px rgba(255,215,107,0.3),
                0 16px 36px rgba(0,0,0,0.6);
        }
        .script-name {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-shadow: 0 0 12px rgba(255,255,255,0.35);
        }
        .script-card.premium-card .script-name {
            color: #ffd76b;
            text-shadow: 0 0 14px rgba(255,215,107,0.55);
        }
        .script-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.05em;
            font-style: italic;
        }
        .scripts-empty {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.05em;
        }

        .plans {
            display: flex; gap: 1.2rem; flex-wrap: wrap;
            justify-content: center;
            width: 100%; max-width: 620px;
        }
        .plan-card {
            flex: 1 1 240px;
            display: flex; flex-direction: column;
            align-items: center; gap: 1rem;
            padding: 1.8rem 1.4rem;
            border-radius: 16px;
            background: rgba(15,15,15,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                        border-color 0.35s ease,
                        box-shadow 0.35s ease;
        }
        .plan-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 18px 40px rgba(0,0,0,0.6);
        }
        .plan-price {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 1.8rem; text-transform: uppercase;
            letter-spacing: 0.03em;
            text-shadow: 0 0 18px rgba(255,255,255,0.35);
        }
        .plan-currency {
            font-size: 0.8rem; letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
        }
        .plan-card .btn {
            margin-top: 0.4rem; font-size: 0.85rem;
            padding: 0.8rem 1.2rem;
        }
        .btn-disabled, .btn:disabled {
            background: linear-gradient(135deg, #4a4a4a 0%, #2a2a2a 100%);
            color: rgba(255,255,255,0.45);
            cursor: not-allowed; box-shadow: none;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-disabled:hover, .btn:disabled:hover {
            transform: none; box-shadow: none;
        }
        .premium-note {
            margin-top: 1.6rem;
            font-size: 0.8rem; letter-spacing: 0.1em;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
        }

        .about-text {
            max-width: 720px;
            font-size: clamp(0.95rem, 1.6vw, 1.1rem);
            line-height: 1.8;
            color: rgba(255,255,255,0.88);
            text-align: center; letter-spacing: 0.01em;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        .about-text a {
            color: #fff; font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.5);
            transition: color 0.3s ease,
                        border-color 0.3s ease,
                        text-shadow 0.3s ease;
        }
        .about-text a:hover {
            color: #8affc1;
            border-color: #8affc1;
            text-shadow: 0 0 14px rgba(138,255,193,0.5);
        }
        .about-signature {
            margin-top: 2rem;
            font-family: 'Rubik Mono One', sans-serif;
            font-size: clamp(1rem, 2vw, 1.4rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.85);
            text-shadow:
                0 0 12px rgba(255,255,255,0.4),
                2px 2px 0 rgba(0,0,0,0.85);
        }

        .owner-panel {
            width: 100%; max-width: 460px;
            display: flex; flex-direction: column; gap: 1rem;
        }
        .owner-panel .info {
            font-size: 0.85rem; color: rgba(255,255,255,0.55);
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }
        .owner-input {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 0.9rem 1.1rem;
            border-radius: 10px;
            border: 1px solid rgba(255,215,107,0.35);
            background: rgba(255,215,107,0.06);
            color: #fff; outline: none;
            transition: border 0.25s ease, background 0.25s ease;
        }
        .owner-input::placeholder { color: rgba(255,255,255,0.5); }
        .owner-input:focus {
            border-color: rgba(255,215,107,0.8);
            background: rgba(255,215,107,0.12);
        }
        .owner-actions {
            display: flex; gap: 0.7rem; margin-top: 0.4rem;
        }
        .owner-actions .btn {
            font-size: 0.8rem; padding: 0.85rem 1rem;
        }
        .btn-owner {
            background: linear-gradient(135deg, #ffd76b 0%, #b98f2a 100%);
            color: #000;
        }
        .btn-owner-revoke {
            background: transparent;
            color: #ff8a8a;
            border: 1px solid rgba(255,138,138,0.5);
            box-shadow: none;
        }
        .btn-owner-revoke:hover {
            background: rgba(255,80,80,0.12);
            box-shadow: none;
        }
        .owner-status {
            min-height: 1.2rem;
            font-size: 0.85rem;
            text-align: center;
            letter-spacing: 0.03em;
            transition: opacity 0.3s ease;
        }
        .owner-status.ok { color: #8affc1; }
        .owner-status.err { color: #ff6b6b; }

        .stub {
            font-size: 1rem;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.1em; text-transform: uppercase;
        }
        .fade-content { animation: contentFade 0.45s ease; }
        @keyframes contentFade {
            0%   { opacity: 0; transform: translateY(14px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .loading-overlay {
            position: fixed; inset: 0; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.active { opacity: 1; pointer-events: auto; }
        .loading-spinner {
            width: 46px; height: 46px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .layout { flex-direction: column; }
            .sidebar {
                width: 100%; min-width: 0; height: auto;
                flex-direction: row; flex-wrap: wrap;
                align-items: center; gap: 0.4rem;
                padding: 0.9rem;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.12);
            }
            .sidebar .brand {
                width: 100%; margin-bottom: 0.6rem;
                padding-left: 0.4rem; font-size: 1rem;
            }
            .nav-item {
                padding: 0.6rem 0.8rem; font-size: 0.75rem;
            }
            .sidebar .spacer { display: none; }
            .logout {
                font-size: 0.7rem; padding: 0.5rem 0.7rem;
                margin-left: auto;
            }
            .main.main-account { padding-top: 6vh; }
        }
    </style>
</head>
<body>

    <div class="background"></div>
    <div class="gradient-overlay"></div>

    <div class="screen active" id="homeScreen">
        <div class="home-content">
            <h1 class="title">Eris hub</h1>

            <div class="action-area">
                <button class="btn" id="createBtn">Create an account</button>

                <form class="auth-form" id="registerForm" novalidate>
                    <input type="text" id="nickname" placeholder="Придумайте ник" autocomplete="off">
                    <input type="password" id="password" placeholder="Пароль" autocomplete="new-password">
                    <input type="password" id="confirmPassword" placeholder="Подтвердите пароль" autocomplete="new-password">
                    <div class="error-msg" id="errorMsg"></div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Назад</button>
                        <button type="submit" class="btn">Sign up</button>
                    </div>
                    <div class="switch-auth">
                        already have account?
                        <span class="link" id="goToSignIn">sign in</span>
                    </div>
                </form>

                <form class="auth-form" id="loginForm" novalidate>
                    <input type="text" id="loginNickname" placeholder="Ваш ник" autocomplete="off">
                    <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
                    <div class="error-msg" id="loginErrorMsg"></div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="loginCancelBtn">Назад</button>
                        <button type="submit" class="btn">Sign in</button>
                    </div>
                    <div class="switch-auth">
                        don't have account?
                        <span class="link" id="goToSignUp">sign up</span>
                    </div>
                </form>

                <button class="btn account-btn" id="accountBtn">Personal account</button>
            </div>
        </div>
    </div>

    <div class="screen" id="accountScreen">
        <div class="layout">
            <aside class="sidebar">
                <div class="brand">Eris hub</div>

                <a class="nav-item active" data-section="account">Personal account</a>
                <a class="nav-item" data-section="get-script">Get script</a>
                <a class="nav-item" data-section="premium">Premium</a>
                <a class="nav-item" data-section="about">About script</a>
                <a class="nav-item owner" data-section="owner" id="ownerNav" style="display:none;">Owner panel</a>

                <div class="spacer"></div>
                <div class="logout" id="logoutBtn">Выйти</div>
            </aside>

            <main class="main" id="mainArea"></main>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
            signOut, onAuthStateChanged, setPersistence, browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore, doc, setDoc, getDoc, getDocs, updateDoc,
            collection, query, where, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        /* ============ FIREBASE CONFIG ============ */
        const firebaseConfig = {
            apiKey: "AIzaSyADiFJz50JTBCj1U_B0KC0zscMdlsR8IEA",
            authDomain: "eris-hub.firebaseapp.com",
            projectId: "eris-hub",
            storageBucket: "eris-hub.firebasestorage.app",
            messagingSenderId: "423570584013",
            appId: "1:423570584013:web:cabd8d95613fa02d335484"
        };
        /* ========================================= */

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const OWNER_NICKNAME = 'Marlin';
        const CACHE_KEY = 'eris_cached_user';

        /* Говорим Firebase хранить сессию в localStorage,
           чтобы вход сохранялся между перезапусками браузера. */
        setPersistence(auth, browserLocalPersistence).catch(err => {
            console.warn('Не удалось установить persistence:', err);
        });

        const homeScreen = document.getElementById('homeScreen');
        const accountScreen = document.getElementById('accountScreen');
        const mainArea = document.getElementById('mainArea');
        const loadingOverlay = document.getElementById('loadingOverlay');

        const createBtn = document.getElementById('createBtn');
        const registerForm = document.getElementById('registerForm');
        const loginForm = document.getElementById('loginForm');
        const accountBtn = document.getElementById('accountBtn');

        const cancelBtn = document.getElementById('cancelBtn');
        const loginCancelBtn = document.getElementById('loginCancelBtn');
        const goToSignIn = document.getElementById('goToSignIn');
        const goToSignUp = document.getElementById('goToSignUp');

        const errorMsg = document.getElementById('errorMsg');
        const loginErrorMsg = document.getElementById('loginErrorMsg');

        const nicknameInput = document.getElementById('nickname');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');

        const loginNickname = document.getElementById('loginNickname');
        const loginPassword = document.getElementById('loginPassword');

        const logoutBtn = document.getElementById('logoutBtn');
        const ownerNav = document.getElementById('ownerNav');

        let currentUser = null;
        let currentSection = 'account';

        const showLoading = () => loadingOverlay.classList.add('active');
        const hideLoading = () => loadingOverlay.classList.remove('active');

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function nickToEmail(nick) {
            const safe = nick.toLowerCase().replace(/[^a-z0-9._-]/g, '_');
            return `${safe}@eris.local`;
        }

        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const block = (n) => Array.from({length: n},
                () => chars[Math.floor(Math.random() * chars.length)]).join('');
            return `${block(4)}-${block(3)}-${block(2)}`;
        }

        function switchScreen(from, to, delay = 500) {
            from.classList.remove('active');
            setTimeout(() => to.classList.add('active'), delay);
        }

        function cacheUser(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
        }
        function clearCachedUser() {
            try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
        }
        function getCachedUser() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function renderSection(section) {
            currentSection = section;

            mainArea.classList.remove('fade-content');
            void mainArea.offsetWidth;

            if (section === 'account') mainArea.classList.add('main-account');
            else mainArea.classList.remove('main-account');

            mainArea.innerHTML = sections[section]();

            if (section === 'owner') attachOwnerHandlers();
            if (section === 'account') attachAccountHandlers();

            mainArea.classList.add('fade-content');
        }

        const sections = {
            account: () => {
                const nick = currentUser?.nickname || 'гость';
                const premium = currentUser?.premium === true;
                const hwid = currentUser?.hwid || null;
                const key = currentUser?.key || null;

                return `
                    <div class="welcome-row">
                        <span class="welcome-label">Welcome</span>
                        <span class="welcome-name">${escapeHtml(nick)}</span>
                    </div>
                    <div class="params">
                        <div class="param-row">
                            <span class="param-key">Plan</span>
                            <span class="param-value ${premium ? 'premium' : 'free'}">
                                ${premium ? 'Premium' : 'Free'}
                            </span>
                        </div>
                        <div class="param-row">
                            <span class="param-key">HWID</span>
                            <div class="param-right">
                                <span class="param-value ${hwid ? '' : 'none'}">${hwid ? escapeHtml(hwid) : 'none'}</span>
                                <button class="btn-reset" id="resetHwidBtn" ${hwid ? '' : 'disabled'}>Reset</button>
                            </div>
                        </div>
                        <div class="param-row">
                            <span class="param-key">Key</span>
                            <span class="param-value ${key ? 'premium' : 'none'}">${key ? escapeHtml(key) : 'none'}</span>
                        </div>
                    </div>
                `;
            },
            'get-script': () => {
                const premium = currentUser?.premium === true;
                return `
                    <div class="section-title">Get script</div>
                    <div class="scripts">
                        <div class="script-card">
                            <div class="script-name">Free plan script</div>
                            <div class="script-desc">*free plan*</div>
                        </div>
                        ${premium ? `
                            <div class="script-card premium-card">
                                <div class="script-name">Premium plan script</div>
                                <div class="script-desc">*premium script*</div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="scripts-empty">Скоро здесь появятся сами скрипты</div>
                `;
            },
            premium: () => `
                <div class="section-title">Premium</div>
                <div class="plans">
                    <div class="plan-card">
                        <div class="plan-price">270 ₽</div>
                        <div class="plan-currency">Рубли</div>
                        <a class="btn" href="https://funpay.com/lots/offer?id=77475132" target="_blank" rel="noopener">Оплатить</a>
                    </div>
                    <div class="plan-card">
                        <div class="plan-price">400 R$</div>
                        <div class="plan-currency">Robux</div>
                        <button class="btn btn-disabled" disabled>Недоступно</button>
                    </div>
                </div>
                <div class="premium-note">После оплаты ключ будет выдан вручную</div>
            `,
            about: () => `
                <div class="section-title">About script</div>
                <div class="about-text">
                    Eris hub — начинающий проект по созданию скрипта для игры
                    Fling Things And People. Наш скрипт уникален тем, что имеет
                    функционал многих популярных скриптов, хотя стоит копейки
                    и имеет бесплатную версию. Следите за обновлениями в нашем
                    дискорд — <a href="https://discord.gg/EX9zPpTVan" target="_blank" rel="noopener">https://discord.gg/EX9zPpTVan</a>
                </div>
                <div class="about-signature">Всем хорошего дня, Марлин</div>
            `,
            owner: () => `
                <div class="section-title">Owner panel</div>
                <div class="owner-panel">
                    <div class="info">Введите ник пользователя, чтобы выдать или забрать Premium.</div>
                    <input class="owner-input" id="ownerTargetNick" placeholder="Ник пользователя" autocomplete="off">
                    <div class="owner-actions">
                        <button class="btn btn-owner" id="grantBtn">Выдать Premium</button>
                        <button class="btn btn-owner-revoke" id="revokeBtn">Забрать Premium</button>
                    </div>
                    <div class="owner-status" id="ownerStatus"></div>
                </div>
            `
        };

        function attachAccountHandlers() {
            const resetBtn = document.getElementById('resetHwidBtn');
            if (!resetBtn) return;

            resetBtn.addEventListener('click', async () => {
                if (!currentUser || !currentUser.hwid) return;
                resetBtn.disabled = true;
                showLoading();
                try {
                    await updateDoc(doc(db, 'users', currentUser.uid), {
                        hwid: null
                    });
                    currentUser.hwid = null;
                    cacheUser(currentUser);
                    hideLoading();
                    renderSection('account');
                } catch (err) {
                    console.error(err);
                    hideLoading();
                    alert('Не удалось сбросить HWID: ' + err.message);
                }
            });
        }

        function attachOwnerHandlers() {
            const input = document.getElementById('ownerTargetNick');
            const status = document.getElementById('ownerStatus');
            const grantBtn = document.getElementById('grantBtn');
            const revokeBtn = document.getElementById('revokeBtn');

            const setStatus = (text, type = '') => {
                status.textContent = text;
                status.className = 'owner-status ' + type;
            };

            async function findUserByNick(nick) {
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('nickname', '==', nick));
                const snap = await getDocs(q);
                if (snap.empty) return null;
                const docSnap = snap.docs[0];
                return { id: docSnap.id, ...docSnap.data() };
            }

            async function updatePremium(nick, value) {
                if (!nick) { setStatus('Введите ник', 'err'); return; }
                if (nick === OWNER_NICKNAME) {
                    setStatus('Нельзя менять статус владельца', 'err'); return;
                }

                setStatus('Поиск пользователя...');
                try {
                    const target = await findUserByNick(nick);
                    if (!target) { setStatus('Пользователь не найден', 'err'); return; }

                    const isCurrentlyPremium = target.premium === true;
                    if (value === true && isCurrentlyPremium) {
                        setStatus('У пользователя уже есть Premium', 'err'); return;
                    }
                    if (value === false && !isCurrentlyPremium) {
                        setStatus('У пользователя нет Premium', 'err'); return;
                    }

                    const updates = {
                        premium: value,
                        premiumUpdatedAt: serverTimestamp()
                    };

                    if (value === true) {
                        if (!target.key) updates.key = generateKey();
                    } else {
                        updates.key = null;
                        updates.hwid = null;
                    }

                    await updateDoc(doc(db, 'users', target.id), updates);

                    setStatus(
                        value
                            ? `Premium выдан пользователю ${target.nickname}`
                            : `Premium забран у пользователя ${target.nickname}`,
                        'ok'
                    );

                    if (currentUser && currentUser.uid === target.id) {
                        currentUser.premium = value;
                        if (value === true) {
                            currentUser.key = target.key || updates.key;
                        } else {
                            currentUser.key = null;
                            currentUser.hwid = null;
                        }
                        cacheUser(currentUser);
                        if (currentSection === 'account') renderSection('account');
                    }
                } catch (err) {
                    console.error(err);
                    setStatus('Ошибка: ' + (err.message || 'не удалось выполнить'), 'err');
                }
            }

            grantBtn.addEventListener('click', () => updatePremium(input.value.trim(), true));
            revokeBtn.addEventListener('click', () => updatePremium(input.value.trim(), false));
        }

        function showRegisterForm() {
            loginForm.classList.remove('active');
            registerForm.classList.remove('active');
            createBtn.classList.add('fade-out');
            setTimeout(() => {
                createBtn.style.display = 'none';
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                nicknameInput.focus();
            }, 250);
        }

        function showLoginForm() {
            registerForm.classList.remove('active');
            loginForm.classList.remove('active');
            createBtn.classList.add('fade-out');
            setTimeout(() => {
                createBtn.style.display = 'none';
                registerForm.classList.remove('active');
                loginForm.classList.add('active');
                loginNickname.focus();
            }, 250);
        }

        function backToCreateBtn() {
            errorMsg.textContent = '';
            loginErrorMsg.textContent = '';
            registerForm.classList.remove('active');
            loginForm.classList.remove('active');
            setTimeout(() => {
                createBtn.style.display = '';
                requestAnimationFrame(() => createBtn.classList.remove('fade-out'));
            }, 300);
        }

        createBtn.addEventListener('click', showRegisterForm);
        goToSignIn.addEventListener('click', showLoginForm);
        goToSignUp.addEventListener('click', showRegisterForm);

        cancelBtn.addEventListener('click', backToCreateBtn);
        loginCancelBtn.addEventListener('click', backToCreateBtn);

        /* ============ РЕГИСТРАЦИЯ ============ */
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';

            const nickname = nicknameInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            if (!nickname) { errorMsg.textContent = 'Введите ник'; return; }
            if (nickname.length < 3) { errorMsg.textContent = 'Ник должен быть не короче 3 символов'; return; }
            if (!/^[A-Za-z0-9._-]+$/.test(nickname)) {
                errorMsg.textContent = 'Ник: только латиница, цифры, . _ -';
                return;
            }
            if (!password) { errorMsg.textContent = 'Введите пароль'; return; }
            if (password.length < 6) { errorMsg.textContent = 'Пароль должен быть не короче 6 символов'; return; }
            if (password !== confirm) { errorMsg.textContent = 'Пароли не совпадают'; return; }

            showLoading();
            try {
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('nickname', '==', nickname));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    errorMsg.textContent = 'Такой ник уже занят';
                    hideLoading();
                    return;
                }

                const email = nickToEmail(nickname);
                const cred = await createUserWithEmailAndPassword(auth, email, password);

                await setDoc(doc(db, 'users', cred.user.uid), {
                    nickname: nickname,
                    premium: false,
                    hwid: null,
                    key: null,
                    createdAt: serverTimestamp()
                });

                currentUser = {
                    uid: cred.user.uid,
                    nickname,
                    premium: false,
                    hwid: null,
                    key: null
                };
                cacheUser(currentUser);

                registerForm.classList.remove('active');
                setTimeout(() => {
                    accountBtn.classList.add('visible');
                    hideLoading();
                }, 300);
            } catch (err) {
                console.error(err);
                hideLoading();
                if (err.code === 'auth/email-already-in-use') {
                    errorMsg.textContent = 'Такой ник уже занят';
                } else if (err.code === 'auth/weak-password') {
                    errorMsg.textContent = 'Слишком слабый пароль';
                } else {
                    errorMsg.textContent = 'Ошибка: ' + (err.message || 'не удалось создать аккаунт');
                }
            }
        });

        /* ============ ВХОД ============ */
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginErrorMsg.textContent = '';

            const nickname = loginNickname.value.trim();
            const password = loginPassword.value;

            if (!nickname) { loginErrorMsg.textContent = 'Введите ник'; return; }
            if (!password) { loginErrorMsg.textContent = 'Введите пароль'; return; }

            showLoading();
            try {
                const email = nickToEmail(nickname);
                const cred = await signInWithEmailAndPassword(auth, email, password);

                const ref = doc(db, 'users', cred.user.uid);
                const snap = await getDoc(ref);
                if (!snap.exists()) {
                    loginErrorMsg.textContent = 'Профиль не найден';
                    await signOut(auth);
                    hideLoading();
                    return;
                }
                const data = snap.data();

                currentUser = {
                    uid: cred.user.uid,
                    nickname: data.nickname,
                    premium: data.premium === true,
                    hwid: data.hwid || null,
                    key: data.key || null
                };
                cacheUser(currentUser);

                if (currentUser.nickname === OWNER_NICKNAME) {
                    ownerNav.style.display = '';
                } else {
                    ownerNav.style.display = 'none';
                }

                loginForm.classList.remove('active');
                loginNickname.value = '';
                loginPassword.value = '';

                setTimeout(() => {
                    accountBtn.classList.add('visible');
                    hideLoading();

                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    document.querySelector('.nav-item[data-section="account"]').classList.add('active');
                    renderSection('account');
                    switchScreen(homeScreen, accountScreen);
                }, 300);
            } catch (err) {
                console.error(err);
                hideLoading();
                if (err.code === 'auth/user-not-found' ||
                    err.code === 'auth/wrong-password' ||
                    err.code === 'auth/invalid-credential') {
                    loginErrorMsg.textContent = 'Неверный ник или пароль';
                } else {
                    loginErrorMsg.textContent = 'Ошибка: ' + (err.message || 'не удалось войти');
                }
            }
        });

        /* ============ ПЕРЕХОД В ЛК ============ */
        accountBtn.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelector('.nav-item[data-section="account"]').classList.add('active');
            renderSection('account');
            switchScreen(homeScreen, accountScreen);
        });

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                renderSection(item.dataset.section);
            });
        });

        /* ============ ВЫХОД ============ */
        logoutBtn.addEventListener('click', async () => {
            try { await signOut(auth); } catch (e) { console.error(e); }

            currentUser = null;
            clearCachedUser();

            createBtn.style.display = '';
            createBtn.classList.remove('fade-out');
            registerForm.classList.remove('active');
            loginForm.classList.remove('active');
            accountBtn.classList.remove('visible');
            ownerNav.style.display = 'none';
            nicknameInput.value = '';
            passwordInput.value = '';
            confirmInput.value = '';
            loginNickname.value = '';
            loginPassword.value = '';
            errorMsg.textContent = '';
            loginErrorMsg.textContent = '';

            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelector('.nav-item[data-section="account"]').classList.add('active');
            renderSection('account');
            switchScreen(accountScreen, homeScreen);
        });

        /* =====================================================
           СРАЗУ ПРИ ЗАГРУЗКЕ — берём кэш и показываем кнопку
           Personal account, если пользователь уже был залогинен.
           ===================================================== */
        (function applyCacheOnLoad() {
            const cached = getCachedUser();
            if (cached && cached.nickname) {
                currentUser = cached;
                createBtn.style.display = 'none';
                accountBtn.classList.add('visible');

                if (cached.nickname === OWNER_NICKNAME) {
                    ownerNav.style.display = '';
                }
            }
        })();

        /* =====================================================
           FIREBASE ПОДТВЕРЖДАЕТ СЕССИЮ В ФОНЕ
           ===================================================== */
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                clearCachedUser();
                currentUser = null;
                accountBtn.classList.remove('visible');
                ownerNav.style.display = 'none';
                createBtn.style.display = '';
                createBtn.classList.remove('fade-out');
                return;
            }

            try {
                const ref = doc(db, 'users', user.uid);
                const snap = await getDoc(ref);
                if (!snap.exists()) {
                    clearCachedUser();
                    await signOut(auth);
                    return;
                }
                const data = snap.data();

                currentUser = {
                    uid: user.uid,
                    nickname: data.nickname,
                    premium: data.premium === true,
                    hwid: data.hwid || null,
                    key: data.key || null
                };
                cacheUser(currentUser);

                createBtn.style.display = 'none';
                accountBtn.classList.add('visible');

                if (currentUser.nickname === OWNER_NICKNAME) {
                    ownerNav.style.display = '';
                } else {
                    ownerNav.style.display = 'none';
                }

                // Обновляем ЛК, если он открыт
                if (currentSection === 'account') {
                    renderSection('account');
                }
            } catch (err) {
                console.error('onAuthStateChanged:', err);
            }
        });
    </script>
</body>
</html>
